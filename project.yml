name: CareAlert
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  CareAlert:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CareAlert
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.careapp.carealert
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CareAlert
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  CareAlert:
    build:
      targets:
        CareAlert: all
    run:
      config: Debug
