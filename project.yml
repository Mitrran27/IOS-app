name: CareAlert
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
targets:
  CareAlert:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CareAlert
    info:
      path: CareAlert/App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.careapp.carealert
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
schemes:
  CareAlert:
    build:
      targets:
        CareAlert: all
    run:
      config: Debug
    # Explicit: App Store / TestFlight archives always use Release, where
    # SWIFT_ACTIVE_COMPILATION_CONDITIONS does NOT include DEBUG, so every
    # #if DEBUG block (including the debug login bypass) compiles out.
    archive:
      config: Release
